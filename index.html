<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>열평형 실험 데이터 수집 & 분석</title>
  <!-- Chart.js 및 PapaParse CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; margin: 20px; background-color: #f8f9fa; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .row { display: flex; gap: 15px; }
    .row .form-group { flex: 1; }
    button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #2980b9; }
    #chart-container { margin-top: 30px; position: relative; height: 400px; }
    .padlet-btn { background-color: #e74c3c; margin-top: 15px; text-align: center; text-decoration: none; display: block; line-height: 45px; color: white; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>🌡️ 열평형 실험 데이터 제출 및 시각화</h2>
  
  <form id="expForm">
    <div class="row">
      <div class="form-group">
        <label for="classNum">학급 선택</label>
        <select id="classNum" required>
          <option value="">반을 선택하세요</option>
          <!-- 1반부터 14반까지 -->
          <script>
            for(let i=1; i<=14; i++) {
              document.write(`<option value="${i}">1학년 ${i}반</option>`);
            }
          </script>
        </select>
      </div>
      <div class="form-group">
        <label for="studentInfo">학번 및 이름</label>
        <input type="text" id="studentInfo" placeholder="예: 10501 홍길동" required>
      </div>
      <div class="form-group">
        <label for="groupNum">조 번호</label>
        <input type="number" id="groupNum" placeholder="예: 3" required>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="hotWater">뜨거운 물의 양 (mL)</label>
        <input type="number" id="hotWater" placeholder="100" required>
      </div>
      <div class="form-group">
        <label for="coldWater">차거운 물의 양 (mL)</label>
        <input type="number" id="coldWater" placeholder="100" required>
      </div>
    </div>

    <div class="form-group">
      <label for="csvFile">ScienceCube CSV 파일 업로드</label>
      <input type="file" id="csvFile" accept=".csv" required>
    </div>

    <button type="submit" id="submitBtn">데이터 제출 및 비교 그래프 생성</button>
  </form>

  <!-- 시각화 차트 영역 -->
  <div id="chart-container">
    <canvas id="thermalChart"></canvas>
  </div>

  <!-- 패들렛 이동 버튼 -->
  <a id="padletLink" class="padlet-btn" href="#" target="_blank" style="display:none;">우리 반 Padlet 게시판으로 이동하기 🚀</a>
</div>

<!-- Firebase 모듈 및 메인 스크립트 -->
<script type="module">
  // Firebase SDKs 가져오기 (CDN)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

  // Firebase 설정
  const firebaseConfig = {
    apiKey: "AIzaSyByfpFuV7d2UrYmne98IDNpejg13Fsfkrs",
    authDomain: "songryetemp.firebaseapp.com",
    projectId: "songryetemp",
    storageBucket: "songryetemp.firebasestorage.app",
    messagingSenderId: "228455049757",
    appId: "1:228455049757:web:6e6b344031d09e894c74f4",
    measurementId: "G-K0VE2YENE2"
  };

  // Firebase 초기화
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);

  // 학급별 패들렛 URL 매핑
  const padletUrls = {
    1: "https://padlet.com/songryems/1-1-eri9te6z9s03f0ca",
    2: "https://padlet.com/songryems/1-2-zw9qpeke4op1d1vv",
    3: "https://padlet.com/songryems/1-3-l5x64wjmacg2bgq",
    4: "https://padlet.com/songryems/1-4-tqahr8tzwskphszs",
    5: "https://padlet.com/songryems/1-5-byevw7n4ggnjygp6",
    6: "https://padlet.com/songryems/1-6-9ux7f5blkto1yd0f",
    7: "https://padlet.com/songryems/1-7-9o14vqfeabsty6ka",
    8: "https://padlet.com/songryems/1-8-gdag4jg5v0456d7x",
    9: "https://padlet.com/songryems/1-9-nb53p05fszx14r3v",
    10: "https://padlet.com/songryems/1-10-y1delt6zs29osj3q",
    11: "https://padlet.com/songryems/1-11-a3p7np3wha8qbnoj",
    12: "https://padlet.com/songryems/1-12-el3t0qwfuewtkjgh",
    13: "https://padlet.com/songryems/1-13-1rw65helw7jcje4l",
    14: "https://padlet.com/songryems/1-14-wu4hwar0p6v4swvc"
  };

  let myChart = null;
  const GAS_ENDPOINT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; // GAS 웹앱 배포 URL 입력

  document.getElementById('expForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const classNum = document.getElementById('classNum').value;
    const studentInfo = document.getElementById('studentInfo').value;
    const groupNum = document.getElementById('groupNum').value;
    const hotWater = document.getElementById('hotWater').value;
    const coldWater = document.getElementById('coldWater').value;
    const fileInput = document.getElementById('csvFile').files[0];

    Papa.parse(fileInput, {
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const timeData = [];
        const tempHotData = [];
        const tempColdData = [];

        // ScienceCube CSV 칼럼 구조 추출 (시간, 채널1, 채널2)
        results.data.forEach(row => {
          const keys = Object.keys(row);
          if(keys.length >= 2) {
            timeData.push(row[keys[0]]);
            tempHotData.push(parseFloat(row[keys[1]]));
            if(keys[2]) tempColdData.push(parseFloat(row[keys[2]]));
          }
        });

        // 1. 차트 시각화 업데이트
        renderChart(timeData, tempHotData, tempColdData, groupNum, hotWater, coldWater);

        // 2. Google Sheets DB 저장을 위한 데이터 패킹 및 전송
        const payload = {
          classNum, studentInfo, groupNum, hotWater, coldWater,
          rawCsv: JSON.stringify(results.data)
        };

        fetch(GAS_ENDPOINT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(() => {
          alert('데이터 저장 완료!');
        });

        // 3. 패들렛 링크 표시
        const padletBtn = document.getElementById('padletLink');
        padletBtn.href = padletUrls[classNum];
        padletBtn.style.display = 'block';
      }
    });
  });

  function renderChart(labels, hotData, coldData, group, hotVol, coldVol) {
    const ctx = document.getElementById('thermalChart').getContext('2d');
    
    if(myChart) myChart.destroy();

    myChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: `${group}조 뜨거운 물 (${hotVol}mL)`,
            data: hotData,
            borderColor: 'rgb(255, 99, 132)',
            tension: 0.2,
            fill: false
          },
          {
            label: `${group}조 차거운 물 (${coldVol}mL)`,
            data: coldData,
            borderColor: 'rgb(54, 162, 235)',
            tension: 0.2,
            fill: false
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { title: { display: true, text: '시간 (초)' } },
          y: { title: { display: true, text: '온도 (℃)' } }
        }
      }
    });
  }
</script>
</body>
</html>
